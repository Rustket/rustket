[package]
name = "rustket"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "http2", "rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
