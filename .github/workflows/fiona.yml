name: fionia

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fionia-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deps:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  vuln:
    name: Vulnerability and config scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  cargo-audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  report:
    name: PR review
    if: always() && github.event_name == 'pull_request'
    needs: [secrets, deps, vuln, cargo-audit, codeql]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/github-script@v7
        continue-on-error: true # fork PRs get read-only token
        env:
          RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.RESULTS);
            const icon = r => ({success: "✅", failure: "❌", skipped: "⏭️", cancelled: "🚫"}[r] || "❔");
            const failed = Object.entries(needs).filter(([, v]) => v.result === "failure").map(([k]) => k);
            const rows = Object.entries(needs).map(([k, v]) => `| ${k} | ${icon(v.result)} ${v.result} |`).join("\n");
            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;
            const author = context.payload.pull_request.user.login;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const marker = "<!-- fionia -->";
            const table = `| job | result |\n|---|---|\n${rows}`;

            // dismiss earlier fionia change requests (re-posted below if still failing)
            const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number });
            for (const r of reviews) {
              if (r.state === "CHANGES_REQUESTED" && r.body && r.body.includes(marker)) {
                await github.rest.pulls.dismissReview({ owner, repo, pull_number, review_id: r.id, message: "fionia re-ran" });
              }
            }

            if (failed.length) {
              await github.rest.pulls.createReview({
                owner, repo, pull_number,
                event: "REQUEST_CHANGES",
                body: `${marker}\n### 🚨 fionia found security issues\n@${author} fix before merge.\n\n${table}\n\nFailed: ${failed.join(", ")}\n\nDetails: [workflow run](${runUrl}) and the Security tab (CodeQL).`,
              });
            } else {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pull_number });
              const old = comments.find(c => c.body && c.body.includes(marker));
              const body = `${marker}\n### ✅ fionia: no security issues found\n\n${table}`;
              if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
              else await github.rest.issues.createComment({ owner, repo, issue_number: pull_number, body });
            }

  alert:
    name: Issue alert
    if: always() && github.event_name != 'pull_request'
    needs: [secrets, vuln, cargo-audit, codeql]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.RESULTS);
            const failed = Object.entries(needs).filter(([, v]) => v.result === "failure").map(([k]) => k);
            if (!failed.length) return;
            const { owner, repo } = context.repo;
            const title = "fionia: security check failed";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `Failed: ${failed.join(", ")}\nRef: ${context.ref}\nRun: ${runUrl}`;
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "open" });
            const existing = open.find(i => i.title === title && !i.pull_request);
            if (existing) await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ owner, repo, title, body: `@${owner}\n\n${body}` });
